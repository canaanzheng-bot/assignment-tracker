<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<title>MSLC Pickup Sign-Out</title>
<style>
  :root{
    --bg:#E9EDF1; --card:#FFFFFF; --card2:#F4F6F8;
    --ink:#16202B; --muted:#5A6874; --line:#D6DDE4;
    --blue:#1F4E79; --blue-d:#183D5F;
    --green:#15803D; --green-l:#DDF3E4; --green-line:#B7E3C6; --green-ink:#0F4F27;
    --red:#B3261E; --red-bg:#FDECEA; --red-line:#F3C9C5;
    --amber-bg:#FDF0D5; --amber-line:#F0DBA8; --amber-ink:#8A5A08;
    --shadow:0 1px 2px rgba(22,32,43,.05),0 6px 18px rgba(22,32,43,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 18px 40px;min-height:100%}
  button{font-family:inherit}

  header{display:flex;align-items:flex-start;gap:16px;padding:6px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .brand{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .brand small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
  .clock{margin-left:auto;text-align:right}
  .clock b{display:block;font-size:29px;font-weight:600;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .clock span{font-size:11.5px;color:var(--muted)}

  .lead{font-size:21px;font-weight:600;letter-spacing:-.3px;margin:0 0 4px;text-align:center}
  .lead small{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:5px}

  /* 码输入 */
  .boxes{display:flex;justify-content:center;align-items:center;gap:9px;margin:22px 0 6px}
  .box{width:56px;height:70px;border-radius:13px;background:var(--card);border:2px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;
       font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
  .box.filled{border-color:var(--blue)}
  .box.cursor{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,78,121,.13)}
  .dash{width:16px;height:2px;background:var(--line);border-radius:2px}
  .hint{text-align:center;font-size:13px;color:var(--muted);height:20px;margin-bottom:12px}
  .hint.bad{color:var(--red);font-weight:600}
  .shake{animation:shake .34s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}

  .pad{display:grid;gap:9px}
  .pad.letters{grid-template-columns:repeat(7,1fr)}
  .pad.digits{grid-template-columns:repeat(3,1fr);max-width:340px;margin:0 auto}
  .pad button{background:var(--card);border:1px solid var(--line);border-radius:13px;
              font-size:22px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);
              transition:transform .08s,background .12s}
  .pad.letters button{padding:16px 0}
  .pad.digits button{padding:22px 0;font-size:26px}
  .pad button:active{transform:scale(.95);background:var(--card2)}
  .pad button.wide{grid-column:span 2}
  .pad button.del{color:var(--muted);font-size:19px}

  /* 家庭卡 */
  .modal{position:fixed;inset:0;background:rgba(10,16,24,.6);display:flex;align-items:center;justify-content:center;
         padding:18px;z-index:50;animation:fade .14s}
  .sheet{background:var(--card);border-radius:22px;padding:26px 22px 20px;width:100%;max-width:480px;
         box-shadow:0 18px 50px rgba(10,18,28,.3);max-height:92vh;overflow:auto;animation:rise .18s cubic-bezier(.2,.8,.3,1)}
  .sheet .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);text-align:center}
  .sheet h3{font-size:20px;font-weight:700;margin:10px 0 18px;text-align:center;letter-spacing:-.3px}
  .kid{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card2);
       border:2px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:10px;cursor:pointer}
  .kid.on{background:#EAF2FA;border-color:var(--blue)}
  .kid.done{background:var(--green-l);border-color:var(--green-line);cursor:default}
  .kid .tickbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:#fff;
                display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex:0 0 auto}
  .kid.on .tickbox{background:var(--blue);border-color:var(--blue)}
  .kid.done .tickbox{background:var(--green);border-color:var(--green)}
  .kid .info b{display:block;font-size:19px;font-weight:650;letter-spacing:-.2px}
  .kid .info b .mine{display:inline-block;vertical-align:middle;margin-left:8px;font-style:normal;
       font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:3px 8px;border-radius:999px;
       background:var(--blue);color:#fff}
  .kid.done .info b .mine{background:var(--green)}
  .kid .info span{font-size:13px;color:var(--muted)}
  .kid.done .info span{color:var(--green);font-weight:600}
  .btn{width:100%;border:0;border-radius:14px;padding:20px;font-size:19px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.go{background:var(--green);color:#fff;box-shadow:0 4px 16px rgba(21,128,61,.28)}
  .btn.go:disabled{background:#C9D2DA;color:#8A97A3;box-shadow:none;cursor:default}
  .btn.cancel{background:transparent;color:var(--muted);border:1px solid var(--line);
              font-size:16px;font-weight:500;padding:15px;margin-top:8px}

  /* 成功 */
  .done-screen{position:fixed;inset:0;background:var(--green);color:#fff;display:flex;flex-direction:column;
               align-items:center;justify-content:center;padding:24px;text-align:center;z-index:60;animation:fade .16s}
  .tick{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;
        justify-content:center;font-size:46px;margin-bottom:18px;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
  .done-screen .n{font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.3}
  .done-screen .tm{font-size:22px;font-weight:500;opacity:.94;margin-top:8px;font-variant-numeric:tabular-nums}
  .done-screen .sub{font-size:13.5px;opacity:.8;margin-top:8px}
  .undo{margin-top:26px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);
        border-radius:12px;padding:13px 24px;font-size:15px;font-weight:600;cursor:pointer}

  /* 配对 / 提示页 */
  .pair{max-width:520px;margin:5vh auto 0;text-align:center;background:var(--card);border:1px solid var(--line);
        border-radius:22px;padding:36px 30px;box-shadow:var(--shadow)}
  .pair h1{font-size:21px;margin:0 0 8px;letter-spacing:-.3px}
  .pair p{color:var(--muted);font-size:14px;margin:0 auto 26px;max-width:380px}
  .code{font-size:52px;font-weight:700;letter-spacing:6px;background:var(--card2);border:1px solid var(--line);
        border-radius:16px;padding:22px 12px;margin-bottom:24px}
  .steps{text-align:left;max-width:370px;margin:0 auto 22px;color:var(--muted);font-size:13.5px;line-height:1.9}
  .steps b{color:var(--ink)}
  .status{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .9s linear infinite}
  .blocked{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
           border-radius:12px;padding:15px;font-size:14px;margin-bottom:20px}

  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
        display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
        border-radius:999px;padding:5px 12px;font-weight:600;font-size:11.5px}
  .pill.warn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink)}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===================== 配置 ===================== */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbw1efC1uiCzBlCZs09ohmkWI9hncUWQF892gFrKuhUVj4YT0Vpz1MatEaI-hg_ws8M8YQ/exec',            // ← 部署 Apps Script 后，把 /exec 地址粘到这里
  LETTERS: 2,             // 码的前两位是孩子姓名首字母
  DIGITS: 4,              // 后四位数字
  IDLE_SECONDS: 45,       // 输了一半没人管，多少秒后清空
  SUCCESS_SECONDS: 5,     // 成功页停留秒数（期间可撤销）
  PAIR_POLL_SECONDS: 5
};
/* =============================================== */

var qs = new URLSearchParams(location.search);
if (qs.get('api')) CONFIG.API_URL = qs.get('api');
var LEN = CONFIG.LETTERS + CONFIG.DIGITS;

var app = document.getElementById('app');
var S = { buf:'', hint:'', bad:false, blocked:'', pair:null, dev:null, queue:[], busy:false };
var idleTimer=null, clockTimer=null, pairTimer=null;

/* ---------- 存储 ---------- */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function deviceId(){
  var d = lsGet('mslc_dev_id','');
  if(!d){ var s=''; for(var i=0;i<4;i++) s+=Math.random().toString(36).substring(2,10);
    d='d'+s.substring(0,28); lsSet('mslc_dev_id', d); }
  return d;
}
S.queue = lsGet('mslc_signout_queue',[]);

/* ---------- 网络（JSONP） ---------- */
var seq=0;
function api(params, cb, errCb){
  var name='__cb'+(++seq)+Date.now().toString(36);
  var url=CONFIG.API_URL+'?callback='+name;
  Object.keys(params).forEach(function(k){ url+='&'+k+'='+encodeURIComponent(params[k]); });
  url+='&dev='+encodeURIComponent(deviceId())+'&_='+Date.now();
  var s=document.createElement('script'), done=false;
  var t=setTimeout(function(){ if(!done){done=true;clean();errCb&&errCb('timeout');} },12000);
  function clean(){ clearTimeout(t); try{delete window[name];}catch(e){window[name]=undefined;} s.remove(); }
  window[name]=function(r){ if(done)return; done=true; clean(); cb(r); };
  s.onerror=function(){ if(done)return; done=true; clean(); errCb&&errCb('network'); };
  s.src=url; document.head.appendChild(s);
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtTime(d){ var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM'; h=h%12||12;
  return h+':'+(m<10?'0':'')+m+' '+ap; }
function to12(hhmm){ if(!hhmm) return '';
  var p=hhmm.split(':'), h=parseInt(p[0],10), m=p[1]||'00', ap=h>=12?'PM':'AM'; h=h%12||12;
  return h+':'+m+' '+ap; }
function resetIdle(){
  clearTimeout(idleTimer);
  if(S.buf) idleTimer=setTimeout(function(){ S.buf=''; S.hint=''; S.bad=false; render(); }, CONFIG.IDLE_SECONDS*1000);
}
['pointerdown','keydown'].forEach(function(e){ document.addEventListener(e,resetIdle,{passive:true}); });

/* ---------- 渲染 ---------- */
function render(){
  if(S.blocked){ return renderPair(); }
  if(!S.dev){ return renderLoading(); }
  renderEntry();
}
function headerHTML(){
  var d=new Date();
  return '<header><div class="brand">MSLC<small>Pickup Sign-Out</small></div>'+
    '<div class="clock"><b id="clk">'+fmtTime(d)+'</b><span>'+
    d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})+'</span></div></header>';
}
function footHTML(){
  var n=S.queue.length;
  return '<div class="foot"><span class="pill">'+esc(S.dev?S.dev.name:'')+
    (S.dev&&S.dev.expires?'（'+esc(S.dev.expires)+' 到期）':'')+'</span>'+
    (n?'<span class="pill warn">'+n+' 条待同步</span>':'')+
    '<span style="margin-left:auto">记录自动存档，保留半年</span></div>';
}
function renderLoading(){
  app.innerHTML = headerHTML()+'<p class="lead">正在连接…<small>Connecting</small></p>';
}
function startClock(){
  clearInterval(clockTimer);
  clockTimer=setInterval(function(){ var e=document.getElementById('clk'); if(e) e.textContent=fmtTime(new Date()); },10000);
}

function renderEntry(){
  var boxes='';
  for(var i=0;i<LEN;i++){
    if(i===CONFIG.LETTERS) boxes+='<div class="dash"></div>';
    var ch=S.buf.charAt(i);
    var cls='box'+(ch?' filled':'')+(i===S.buf.length?' cursor':'');
    boxes+='<div class="'+cls+'">'+esc(ch||'')+'</div>';
  }
  var lettersMode = S.buf.length < CONFIG.LETTERS;
  var pad;
  if(lettersMode){
    var A='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    pad='<div class="pad letters">'+A.map(function(c){ return '<button data-k="'+c+'">'+c+'</button>'; }).join('')+
        '<button class="del wide" data-k="DEL">⌫ 删除</button></div>';
  } else {
    var keys=['1','2','3','4','5','6','7','8','9'];
    pad='<div class="pad digits">'+keys.map(function(k){ return '<button data-k="'+k+'">'+k+'</button>'; }).join('')+
        '<button class="del" data-k="DEL">⌫</button><button data-k="0">0</button>'+
        '<button class="del" data-k="CLR">清空</button></div>';
  }
  app.innerHTML = headerHTML()+
    '<p class="lead">请输入孩子的接送码<small>Enter your child’s pickup code</small></p>'+
    '<div class="boxes'+(S.bad?' shake':'')+'" id="boxes">'+boxes+'</div>'+
    '<div class="hint'+(S.bad?' bad':'')+'">'+esc(S.hint || (lettersMode?'先输两个字母（孩子姓名首字母）':'再输四位数字'))+'</div>'+
    pad + footHTML();
  Array.prototype.forEach.call(app.querySelectorAll('.pad button'), function(b){
    b.onclick=function(){ key(b.dataset.k); };
  });
  S.bad=false;
  startClock();
}

function key(k){
  if(S.busy) return;
  S.hint='';
  if(k==='DEL'){ S.buf=S.buf.slice(0,-1); return render(); }
  if(k==='CLR'){ S.buf=''; return render(); }
  if(S.buf.length>=LEN) return;
  S.buf += k;
  if(S.buf.length===LEN){ render(); return submit(); }
  render();
}

function submit(){
  S.busy=true; S.hint='查询中…'; render();
  var code=S.buf;
  api({action:'lookup', code:code}, function(r){
    S.busy=false;
    if(r && r.ok){ S.buf=''; S.hint=''; render(); familyCard(code, r); }
    else if(r && r.error==='NOT_FOUND'){
      S.buf=''; S.bad=true;
      S.hint='没找到这个码，请检查后重输' + (r.left<=2 ? '（还可以试 '+r.left+' 次）' : '');
      render();
    }
    else if(r && r.error==='TOO_MANY_TRIES'){
      S.buf=''; S.bad=true; S.hint='错误次数太多，请等 '+r.wait+' 秒，或找办公室帮忙'; render();
    }
    else if(r && r.error==='DEVICE_NOT_AUTHORIZED'){ S.blocked=r.status||'revoked'; startPairing(); }
    else if(r && r.error==='OUTSIDE_HOURS'){ S.buf=''; S.bad=true; S.hint='现在不在签出时段（'+esc(r.hours||'')+'）'; render(); }
    else { S.buf=''; S.bad=true; S.hint='出错了，请再试一次'; render(); }
  }, function(){
    S.busy=false; S.buf=''; S.bad=true;
    S.hint='网络连不上，请找办公室手工登记'; render();
  });
}

/* ---------- 家庭卡 ---------- */
function familyCard(code, data){
  var pick={};
  data.children.forEach(function(c){ if(!c.out) pick[c.id]=true; });
  var el=document.createElement('div');
  el.className='modal';
  document.body.appendChild(el);
  var closed=false, autoClose=setTimeout(close, 60000);
  function close(){ if(closed)return; closed=true; clearTimeout(autoClose); el.remove(); }

  function draw(){
    var n=Object.keys(pick).filter(function(k){return pick[k];}).length;
    var multi = data.children.length>1;
    el.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="eyebrow">确认接走 · Confirm pickup</div>'+
      '<h3>'+(multi?'今天要接走谁？<span style="font-weight:400;color:var(--muted);font-size:14px;display:block;margin-top:4px">兄弟姐妹已经一起列出来了，点一下可以取消选中</span>':'确认接走')+'</h3>'+
      data.children.map(function(c){
        if(c.out) return '<div class="kid done"><div class="tickbox">✓</div><div class="info">'+
          '<b>'+esc(c.name)+(c.entered?'<em class="mine">你输入的码</em>':'')+'</b>'+
          '<span>已于 '+esc(to12(c.out))+' 接走</span></div></div>';
        return '<button class="kid'+(pick[c.id]?' on':'')+'" data-id="'+esc(c.id)+'">'+
          '<div class="tickbox">'+(pick[c.id]?'✓':'')+'</div><div class="info"><b>'+esc(c.name)+
          (c.entered?'<em class="mine">你输入的码</em>':'')+'</b>'+
          '<span>'+esc(c.grade)+(c.cn?' · '+esc(c.cn):'')+'</span></div></button>';
      }).join('')+
      '<button class="btn go" id="ok"'+(n?'':' disabled')+'>✓ 确认接走'+(n>1?'（'+n+' 个孩子）':'')+'</button>'+
      '<button class="btn cancel" id="no">取消 Cancel</button></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.kid[data-id]'), function(b){
      b.onclick=function(){ var id=b.dataset.id; pick[id]=!pick[id]; draw(); };
    });
    el.querySelector('#no').onclick=close;
    el.querySelector('#ok').onclick=function(){
      var ids=Object.keys(pick).filter(function(k){return pick[k];});
      if(!ids.length) return;
      close(); doSignout(code, ids, data);
    };
  }
  el.onclick=function(e){ if(e.target===el) close(); };
  draw();
}

/* ---------- 签出 ---------- */
function doSignout(code, ids, data){
  var when=new Date();
  var names = data.children.filter(function(c){ return ids.indexOf(c.id)>=0; }).map(function(c){ return c.name; });
  var payload={ action:'signout', code:code, ids:ids.join(','), t:when.toISOString() };
  var rids=[];
  successScreen(names, when, function(){
    if(rids.length) api({action:'undo', rids:rids.join(',')}, function(){}, function(){});
    else {
      S.queue = S.queue.filter(function(q){ return q.t!==payload.t; });
      lsSet('mslc_signout_queue', S.queue);
    }
  });
  api(payload, function(r){
    if(r && r.ok){ rids=(r.results||[]).map(function(x){ return x.rid; }).filter(Boolean); }
    else if(r && r.error==='DEVICE_NOT_AUTHORIZED'){ S.blocked=r.status||'revoked'; }
    else queueUp(payload);
  }, function(){ queueUp(payload); });
}
function queueUp(p){ S.queue.push(p); lsSet('mslc_signout_queue', S.queue); }
function flushQueue(){
  if(!S.queue.length || S.blocked) return;
  var p=S.queue[0];
  api(p, function(r){
    if(r && r.ok){ S.queue.shift(); lsSet('mslc_signout_queue', S.queue);
      S.queue.length ? flushQueue() : render(); }
  }, function(){});
}
setInterval(flushQueue, 15000);

/* ---------- 成功页 ---------- */
function successScreen(names, when, undoFn){
  clearTimeout(idleTimer);
  var el=document.createElement('div');
  el.className='done-screen';
  el.innerHTML='<div class="tick">✓</div><div class="n">'+names.map(esc).join('<br>')+'</div>'+
    '<div class="tm">'+fmtTime(when)+'</div>'+
    '<div class="sub">已记录接走时间 · Pickup time recorded</div>'+
    '<button class="undo" id="undo">点错了？撤销 Undo</button>';
  document.body.appendChild(el);
  var t=setTimeout(finish, CONFIG.SUCCESS_SECONDS*1000);
  function finish(){ clearTimeout(t); el.remove(); S.buf=''; S.hint=''; render(); }
  el.querySelector('#undo').onclick=function(){ clearTimeout(t); undoFn(); el.remove(); S.buf=''; S.hint=''; render(); };
}

/* ---------- 设备配对 ---------- */
var PAIR_MSG = {
  pending:'', unknown:'',
  revoked:'这台设备已被办公室停用。需要重新启用请找办公室。',
  expired:'这台设备的临时授权已过期。今天还要用的话，请办公室再批准一次。'
};
function renderPair(){
  clearInterval(clockTimer);
  var code = S.pair && S.pair.code ? S.pair.code : '……';
  var note = PAIR_MSG[S.blocked] || '';
  app.innerHTML='<div class="pair">'+
    (note?'<div class="blocked">'+esc(note)+'</div>':'')+
    '<h1>这台设备还没有授权</h1>'+
    '<p>只有办公室批准过的设备可以用来签出。</p>'+
    '<div class="code">'+esc(code)+'</div>'+
    '<div class="steps"><b>1.</b> 把上面这个码告诉办公室<br>'+
    '<b>2.</b> 办公室在「后台 → 设备管理」里找到它<br>'+
    '<b>3.</b> 点「批准」，这一页会自动进入</div>'+
    '<div class="status"><span class="spin"></span>等待批准中…每 '+CONFIG.PAIR_POLL_SECONDS+' 秒自动检查</div></div>';
}
function startPairing(){
  clearInterval(pairTimer);
  renderPair();
  api({action:'enroll', info:navigator.platform+' / '+screen.width+'x'+screen.height}, function(r){
    if(r && r.ok) S.pair=r;
    renderPair();
  }, function(){ renderPair(); });
  pairTimer=setInterval(function(){
    api({action:'devstatus'}, function(r){
      if(r && r.status==='active'){ clearInterval(pairTimer); S.blocked=''; S.pair=null; hello(); }
      else if(r && r.code && (!S.pair||S.pair.code!==r.code)){ S.pair=r; renderPair(); }
    }, function(){});
  }, CONFIG.PAIR_POLL_SECONDS*1000);
}

/* ---------- 启动 ---------- */
function hello(){
  api({action:'hello'}, function(r){
    if(r && r.ok){ S.blocked=''; S.dev=r; render(); }
    else if(r && r.error==='DEVICE_NOT_AUTHORIZED'){ S.blocked=r.status||'pending'; startPairing(); }
    else if(r && r.error==='OUTSIDE_HOURS'){
      app.innerHTML=headerHTML()+'<p class="lead">现在不在签出时段<small>开放时间：'+esc(r.hours||'')+'</small></p>';
    }
    else { app.innerHTML=headerHTML()+'<p class="lead">载入失败<small>'+esc((r&&r.error)||'未知错误')+'</small></p>'; }
  }, function(){
    app.innerHTML=headerHTML()+'<p class="lead">连不上服务器<small>8 秒后自动重试</small></p>';
    setTimeout(hello, 8000);
  });
}
setInterval(function(){ if(!S.blocked && S.dev && !S.buf && !S.busy) hello(); }, 300000);

if(!CONFIG.API_URL){
  app.innerHTML='<div class="pair"><h1>还没配置 API</h1>'+
    '<p>请把 Apps Script 的 /exec 地址填进 index.html 顶部的 <b>CONFIG.API_URL</b>。</p></div>';
} else {
  hello();
}
</script>
</body>
</html>
